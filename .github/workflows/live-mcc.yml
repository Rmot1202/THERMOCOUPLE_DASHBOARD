name: Live MCC dashboard

on:
  push:
    branches:
      - github-dashboard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-mcc-dashboard
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test dashboard
    runs-on: [self-hosted, linux, ARM64, live-mcc]
    timeout-minutes: 20

    env:
      VENV: ${{ runner.temp }}/thermocouple-dashboard-ci-${{ github.run_id }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$VENV"
          . "$VENV/bin/activate"
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Run dashboard tests
        run: |
          set -euo pipefail
          . "$VENV/bin/activate"
          python -m pytest -q tests

      - name: Clean test environment
        if: always()
        run: |
          set -euo pipefail
          case "$VENV" in
            "$RUNNER_TEMP"/*) rm -rf "$VENV" ;;
            *) echo "Refusing to remove unexpected path: $VENV" >&2; exit 1 ;;
          esac

  deploy:
    name: Deploy to Camp-U24-Pi5
    needs: test
    runs-on: [self-hosted, linux, ARM64, live-mcc]
    timeout-minutes: 10
    environment:
      name: live-mcc
      url: https://10.0.20.21/

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy dashboard
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/deploy-thermocouple-dashboard "$GITHUB_WORKSPACE"

      - name: Smoke test dashboard
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --insecure --silent --show-error --max-time 10 https://10.0.20.21/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Dashboard did not respond after deployment" >&2
          exit 1
