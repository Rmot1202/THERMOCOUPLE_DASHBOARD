name: Live MCC dashboard

on:
  push:
    branches:
      - github-dashboard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-mcc-dashboard
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test dashboard
    runs-on: [self-hosted, linux, ARM64, live-mcc]
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/thermocouple-dashboard-ci-$GITHUB_RUN_ID"
          python3 -m venv "$VENV"
          . "$VENV/bin/activate"
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Run dashboard tests
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/thermocouple-dashboard-ci-$GITHUB_RUN_ID"
          . "$VENV/bin/activate"
          python -m pytest -q tests

      - name: Clean test environment
        if: always()
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/thermocouple-dashboard-ci-$GITHUB_RUN_ID"
          case "$VENV" in
            "$RUNNER_TEMP"/*) rm -rf "$VENV" ;;
            *) echo "Refusing to remove unexpected path: $VENV" >&2; exit 1 ;;
          esac

  deploy:
    name: Deploy to Camp-U24-Pi5
    needs: test
    runs-on: [self-hosted, linux, ARM64, live-mcc]
    timeout-minutes: 10
    env:
      DASHBOARD_URL: https://10.0.20.21/
      LOCAL_DASHBOARD_URL: http://127.0.0.1:8050/
    environment:
      name: live-mcc
      url: https://10.0.20.21/

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy dashboard
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/deploy-thermocouple-dashboard "$GITHUB_WORKSPACE"

      - name: Smoke test dashboard
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            echo "Smoke test attempt $attempt/12: $DASHBOARD_URL"
            if curl --fail --insecure --silent --show-error --connect-timeout 5 --max-time 10 "$DASHBOARD_URL" >/dev/null; then
              echo "Dashboard responded at $DASHBOARD_URL"
              exit 0
            fi
            sleep 5
          done

          echo "Dashboard did not respond after deployment" >&2
          echo "Checking local dashboard service..." >&2
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$LOCAL_DASHBOARD_URL" >/dev/null \
            && echo "Dashboard responded locally at $LOCAL_DASHBOARD_URL" >&2 \
            || echo "Dashboard did not respond locally at $LOCAL_DASHBOARD_URL" >&2
          sudo systemctl --no-pager --full status thermocouple-dashboard || true
          sudo ss -ltnp || true
          exit 1
