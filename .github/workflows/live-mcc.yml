name: Live MCC dashboard

on:
  push:
    branches:
      - github-dashboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test dashboard
    runs-on: [self-hosted, linux, ARM64, live-mcc]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create test environment
        run: |
          set -euo pipefail
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run dashboard tests
        run: |
          set -euo pipefail
          . .ci-venv/bin/activate
          python -m pytest -q

  deploy:
    name: Deploy to Camp-U24-Pi5
    needs: test
    runs-on: [self-hosted, linux, ARM64, live-mcc]
    environment:
      name: live-mcc
      url: https://10.0.20.21/

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy dashboard
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/deploy-thermocouple-dashboard "$GITHUB_WORKSPACE"