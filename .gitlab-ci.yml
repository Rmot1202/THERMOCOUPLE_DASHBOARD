stages:
  - test
  - deploy

test-dashboard:
  stage: test
  tags:
    - mcc-ubuntu
  script:
    - cd /opt/Thermocouple_dashboard
    - ./venv/bin/python -m pytest -q
  rules:
    - if: '$CI_COMMIT_BRANCH == "github-dashboard"'

deploy-live-mcc:
  stage: deploy
  tags:
    - mcc-ubuntu
  when: manual
  script:
    - cd /opt/Thermocouple_dashboard
    - sudo systemctl stop thermocouple-dashboard
    - git fetch gitlab github-dashboard
    - git checkout github-dashboard
    - git pull --ff-only gitlab github-dashboard
    - ./venv/bin/pip install -r requirements.txt
    - sudo systemctl start thermocouple-dashboard
    - sudo systemctl --no-pager status thermocouple-dashboard
  rules:
    - if: '$CI_COMMIT_BRANCH == "github-dashboard"'